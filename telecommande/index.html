<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Télécommande PC</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --btn: #232733; --btn-hover: #2c3140;
    --text: #e8eaf0; --muted: #8a90a2; --accent: #4f8cff; --ok: #3ccf91;
    --danger: #ff5c5c; --warn: #ffb547; --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f3f7; --panel: #ffffff; --btn: #eceef4; --btn-hover: #e1e4ec;
      --text: #161922; --muted: #646b7e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.busy { background: var(--warn); }
  section { background: var(--panel); border-radius: var(--radius); padding: 14px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
               color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  button {
    font: inherit; color: var(--text); background: var(--btn); border: 0;
    border-radius: 12px; padding: 14px 8px; min-height: 58px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: background .15s, transform .08s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button .ic { font-size: 22px; line-height: 1; }
  button small { font-size: 12px; color: var(--muted); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary small { color: #ffffffcc; }
  button.danger { background: color-mix(in srgb, var(--danger) 22%, var(--btn)); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--btn);
          padding: 4px; border-radius: 12px; margin-bottom: 12px; }
  .tabs button { min-height: 40px; padding: 8px; background: transparent; flex-direction: row; }
  .tabs button[aria-selected="true"] { background: var(--panel); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=password], input[type=text] {
    width: 100%; font: inherit; font-size: 20px; letter-spacing: .3em; text-align: center;
    padding: 10px; border-radius: 12px; border: 1px solid var(--btn-hover);
    background: var(--bg); color: var(--text);
  }
  .slider { display: grid; grid-template-columns: 58px 1fr 58px; gap: 10px; align-items: center; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .note.err { color: var(--danger); }
  #toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(150%); background: var(--panel); color: var(--text);
    padding: 12px 18px; border-radius: 12px; box-shadow: 0 8px 30px #0006;
    max-width: calc(100% - 32px); transition: transform .25s; border-left: 4px solid var(--ok);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { border-left-color: var(--danger); }
  .controls.locked { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🖥️ Télécommande PC</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Déconnecté</span></div>
  </header>

  <section>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabBle" aria-selected="true">🔵 Bluetooth</button>
      <button role="tab" id="tabWifi" aria-selected="false">📶 Wi-Fi local</button>
    </div>
    <label for="pin">Code PIN (affiché dans la fenêtre de l'agent)</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <div class="row two" style="margin-top:12px">
      <button class="primary" id="connectBtn"><span class="ic">🔗</span><small>Connecter</small></button>
      <button id="disconnectBtn" disabled><span class="ic">⛔</span><small>Déconnecter</small></button>
    </div>
    <p class="note" id="modeNote"></p>
  </section>

  <div class="controls locked" id="controls">
    <section>
      <h2>Son</h2>
      <div class="row">
        <button data-cmd="volume_down"><span class="ic">🔉</span><small>Baisser</small></button>
        <button data-cmd="volume_mute"><span class="ic">🔇</span><small>Muet</small></button>
        <button data-cmd="volume_up"><span class="ic">🔊</span><small>Monter</small></button>
      </div>
    </section>

    <section style="margin-top:14px">
      <h2>Luminosité</h2>
      <div class="slider">
        <button data-cmd="brightness_down" aria-label="Baisser la luminosité"><span class="ic">🔅</span></button>
        <input type="range" id="brightness" min="0" max="100" step="5" value="50" aria-label="Luminosité">
        <button data-cmd="brightness_up" aria-label="Monter la luminosité"><span class="ic">🔆</span></button>
      </div>
    </section>

    <section style="margin-top:14px">
      <h2>Multimédia</h2>
      <div class="row">
        <button data-cmd="media_prev"><span class="ic">⏮️</span><small>Précédent</small></button>
        <button data-cmd="media_play_pause"><span class="ic">⏯️</span><small>Lecture</small></button>
        <button data-cmd="media_next"><span class="ic">⏭️</span><small>Suivant</small></button>
      </div>
    </section>

    <section style="margin-top:14px">
      <h2>Alimentation</h2>
      <div class="row">
        <button data-cmd="lock"><span class="ic">🔒</span><small>Verrouiller</small></button>
        <button data-cmd="screen_off"><span class="ic">🌑</span><small>Écran off</small></button>
        <button data-cmd="sleep" data-confirm="Mettre l'ordinateur en veille ?"><span class="ic">💤</span><small>Veille</small></button>
        <button class="danger" data-cmd="restart" data-confirm="Redémarrer l'ordinateur dans 30 s ?"><span class="ic">🔄</span><small>Redémarrer</small></button>
        <button class="danger" data-cmd="shutdown" data-confirm="Éteindre l'ordinateur dans 30 s ?"><span class="ic">⏻</span><small>Éteindre</small></button>
        <button data-cmd="cancel_shutdown"><span class="ic">✋</span><small>Annuler</small></button>
      </div>
    </section>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Identifiants Bluetooth — identiques à telecommande/agent.py
const SERVICE_UUID = "6e3a1c00-5b2f-4c7e-9a41-7c0de0a1b2c3";
const COMMAND_UUID = "6e3a1c01-5b2f-4c7e-9a41-7c0de0a1b2c3";
const STATUS_UUID  = "6e3a1c02-5b2f-4c7e-9a41-7c0de0a1b2c3";

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const bleSupported = !!navigator.bluetooth && window.isSecureContext;
const servedByAgent = location.protocol === "http:" || location.hostname === "localhost";

let mode = store.get("mode") || (bleSupported ? "ble" : "wifi");
if (mode === "wifi" && !servedByAgent) mode = "ble";
let connected = false;

// ---------- Interface ----------
function setStatus(state, text) {
  $("dot").className = "dot" + (state === "on" ? " on" : state === "busy" ? " busy" : "");
  $("statusText").textContent = text;
}
let toastTimer;
function toast(msg, isErr = false) {
  const t = $("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = isErr ? "err" : ""), 2600);
}
function setConnected(on, label) {
  connected = on;
  $("controls").classList.toggle("locked", !on);
  $("disconnectBtn").disabled = !on;
  $("connectBtn").disabled = on;
  setStatus(on ? "on" : "off", on ? label : "Déconnecté");
}
function renderMode() {
  $("tabBle").setAttribute("aria-selected", mode === "ble");
  $("tabWifi").setAttribute("aria-selected", mode === "wifi");
  const note = $("modeNote");
  note.classList.remove("err");
  if (mode === "ble") {
    if (bleSupported) {
      note.textContent = "Active le Bluetooth sur le PC et ce téléphone, lance l'agent, puis « Connecter » et choisis ton PC dans la liste.";
    } else {
      note.classList.add("err");
      note.textContent = !navigator.bluetooth
        ? "Ce navigateur ne gère pas le Web Bluetooth. Utilise Chrome ou Edge (Android, Windows, macOS, Linux). Sur iPhone : ouvre cette page dans l'app gratuite « Bluefy » (App Store)."
        : "Le Bluetooth web exige une page en HTTPS (ex. GitHub Pages). Ici, utilise le mode Wi-Fi.";
    }
  } else {
    note.textContent = servedByAgent
      ? `Connexion à l'agent via le réseau local (${location.host}).`
      : "Le mode Wi-Fi fonctionne en ouvrant directement http://IP-DU-PC:8765 (adresse affichée par l'agent).";
  }
}

// ---------- Transport Bluetooth ----------
const ble = {
  device: null, cmdChar: null, pending: null,
  async connect() {
    this.device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }, { namePrefix: "PC-" }],
      optionalServices: [SERVICE_UUID],
    });
    this.device.addEventListener("gattserverdisconnected", () => {
      if (connected) { setConnected(false); toast("Bluetooth déconnecté", true); }
    });
    setStatus("busy", "Connexion…");
    const server = await this.device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    this.cmdChar = await service.getCharacteristic(COMMAND_UUID);
    const statusChar = await service.getCharacteristic(STATUS_UUID);
    statusChar.addEventListener("characteristicvaluechanged", (e) => {
      const text = new TextDecoder().decode(e.target.value);
      const [state, ...rest] = text.split("|");
      if (this.pending) { this.pending({ ok: state === "ok", message: rest.join("|") }); this.pending = null; }
    });
    await statusChar.startNotifications();
    return this.device.name || "PC";
  },
  send(pin, command) {
    return new Promise(async (resolve, reject) => {
      const timer = setTimeout(() => { this.pending = null; reject(new Error("Pas de réponse du PC")); }, 10000);
      this.pending = (r) => { clearTimeout(timer); resolve(r); };
      try {
        const data = new TextEncoder().encode(`${pin}|${command}`);
        // Bluefy (iPhone) et les anciens navigateurs n'ont parfois que writeValue
        if (this.cmdChar.writeValueWithResponse) await this.cmdChar.writeValueWithResponse(data);
        else await this.cmdChar.writeValue(data);
      } catch (e) { clearTimeout(timer); this.pending = null; reject(e); }
    });
  },
  disconnect() { if (this.device?.gatt.connected) this.device.gatt.disconnect(); },
};

// ---------- Transport Wi-Fi ----------
const wifi = {
  async send(pin, command) {
    const res = await fetch("/api", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin, command }),
    });
    return res.json();
  },
};

// ---------- Logique ----------
let queue = Promise.resolve();
function send(command) {
  const pin = $("pin").value.trim();
  const transport = mode === "ble" ? ble : wifi;
  queue = queue.then(() => transport.send(pin, command)).then((r) => {
    toast(r.message, !r.ok);
    return r;
  }).catch((e) => { toast(e.message || String(e), true); });
  return queue;
}

async function connect() {
  const pin = $("pin").value.trim();
  if (!/^\d{6}$/.test(pin)) { toast("Saisis le code PIN à 6 chiffres", true); $("pin").focus(); return; }
  store.set("pin", pin);
  try {
    let label;
    if (mode === "ble") {
      if (!bleSupported) { renderMode(); return; }
      label = await ble.connect();
    } else {
      if (!servedByAgent) { renderMode(); return; }
      setStatus("busy", "Connexion…");
      label = location.hostname;
    }
    const r = await (mode === "ble" ? ble : wifi).send(pin, "ping");
    if (!r.ok) { ble.disconnect(); setConnected(false); toast(r.message, true); return; }
    setConnected(true, label);
    toast(r.message);
  } catch (e) {
    setConnected(false);
    if (e.name !== "NotFoundError") toast(e.message || String(e), true); // NotFoundError = liste fermée
  }
}

$("connectBtn").addEventListener("click", connect);
$("disconnectBtn").addEventListener("click", () => { ble.disconnect(); setConnected(false); });
$("tabBle").addEventListener("click", () => { if (connected) return; mode = "ble"; store.set("mode", mode); renderMode(); });
$("tabWifi").addEventListener("click", () => { if (connected) return; mode = "wifi"; store.set("mode", mode); renderMode(); });

document.querySelectorAll("[data-cmd]").forEach((b) => {
  b.addEventListener("click", () => {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    send(b.dataset.cmd).then((r) => {
      const m = r && r.ok && /Luminosité (\d+)/.exec(r.message);
      if (m) $("brightness").value = m[1];
    });
  });
});
$("brightness").addEventListener("change", (e) => send(`brightness_set=${e.target.value}`));

$("pin").value = store.get("pin") || "";
renderMode();
</script>
</body>
</html>
